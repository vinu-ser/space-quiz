<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cosmic Quest — Space Exploration Quiz</title>
  <style>
    :root {
      --bg: #f4f6ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --text: #17203d;
      --muted: #647095;
      --border: rgba(92, 106, 166, 0.2);
      --primary: #6558e8;
      --primary-hover: #5144d5;
      --primary-soft: #eceaff;
      --correct: #16865b;
      --correct-bg: #e4f8ef;
      --wrong: #d1415a;
      --wrong-bg: #ffeaee;
      --shadow: 0 24px 70px rgba(56, 62, 126, 0.16);
      --focus: #4f46e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d1d;
        --surface: rgba(20, 26, 51, 0.9);
        --surface-solid: #141a33;
        --text: #f3f5ff;
        --muted: #a6afd2;
        --border: rgba(171, 180, 224, 0.18);
        --primary: #9187ff;
        --primary-hover: #aaa2ff;
        --primary-soft: #292650;
        --correct: #55d69d;
        --correct-bg: #123a30;
        --wrong: #ff758a;
        --wrong-bg: #45202b;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        --focus: #b1aaff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 18%, rgba(112, 96, 255, 0.2), transparent 25rem),
        radial-gradient(circle at 88% 78%, rgba(45, 191, 169, 0.16), transparent 24rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      color: var(--primary);
      opacity: 0.16;
      pointer-events: none;
    }

    body::before {
      content: "✦";
      top: 8%;
      left: 9%;
      font-size: 54px;
      animation: drift 7s ease-in-out infinite;
    }

    body::after {
      content: "●";
      right: 8%;
      bottom: 10%;
      font-size: 38px;
      animation: drift 8s ease-in-out 1s infinite reverse;
    }

    .app {
      width: min(100%, 560px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-icon {
      font-size: 22px;
      line-height: 1;
      animation: orbit 8s linear infinite;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #695cf5, #42c6be, #f6a64b);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 11px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .score {
      color: var(--primary);
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--primary-soft);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6658eb, #42c6be);
      transition: width 400ms cubic-bezier(.2, .8, .2, 1);
    }

    .question-wrap {
      margin-top: 34px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      font-size: clamp(25px, 6vw, 34px);
      line-height: 1.18;
      letter-spacing: -0.035em;
    }

    h2 {
      font-size: clamp(22px, 5vw, 29px);
    }

    .answers {
      display: grid;
      gap: 11px;
      margin: 27px 0 0;
      padding: 0;
      border: 0;
    }

    .answer {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      background: var(--surface-solid);
      font: inherit;
      font-weight: 650;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      transition:
        transform 160ms ease,
        color 260ms ease,
        border-color 260ms ease,
        background-color 260ms ease,
        box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .answer:active:not(:disabled) {
      transform: translateY(1px) scale(0.985);
      box-shadow: inset 0 2px 5px rgba(23, 32, 61, 0.14);
    }

    .answer:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--focus) 18%, transparent);
    }

    .next-button:focus-visible,
    .restart-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled {
      cursor: default;
    }

    .answer-letter {
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 12px;
      font-weight: 850;
      transition: color 260ms ease, background-color 260ms ease;
    }

    .answer.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-bg);
      animation: correctPop 420ms ease;
    }

    .answer.correct .answer-letter {
      color: #fff;
      background: var(--correct);
    }

    .answer.wrong {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-bg);
      animation: wrongShake 420ms ease;
    }

    .answer.wrong .answer-letter {
      color: #fff;
      background: var(--wrong);
    }

    .answer.dimmed {
      opacity: 0.5;
    }

    .feedback-row {
      min-height: 48px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 17px;
    }

    .feedback {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .feedback.good {
      color: var(--correct);
    }

    .feedback.bad {
      color: var(--wrong);
    }

    .next-button,
    .restart-button {
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 25%, transparent);
      transition: transform 160ms ease, background 160ms ease;
    }

    .next-button {
      flex: 0 0 auto;
      padding: 10px 16px;
    }

    .restart-button {
      padding: 13px 20px;
    }

    .next-button:hover,
    .restart-button:hover {
      transform: translateY(-2px);
      background: var(--primary-hover);
    }

    [hidden] {
      display: none !important;
    }

    .results {
      padding: 16px 0 8px;
      text-align: center;
      animation: reveal 550ms ease both;
    }

    .result-emoji {
      margin-bottom: 18px;
      font-size: 74px;
      line-height: 1;
      filter: drop-shadow(0 10px 18px rgba(83, 75, 185, 0.2));
      animation: resultBounce 750ms cubic-bezier(.2, .8, .2, 1);
    }

    .result-label {
      margin: 13px 0 2px;
      color: var(--muted);
      font-weight: 650;
    }

    .final-score {
      margin: 0;
      color: var(--primary);
      font-size: clamp(40px, 10vw, 58px);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .result-message {
      max-width: 390px;
      margin: 8px auto 26px;
      color: var(--muted);
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes resultBounce {
      0% { transform: scale(0.4) rotate(-12deg); opacity: 0; }
      65% { transform: scale(1.12) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-16px) rotate(12deg); }
    }

    @keyframes orbit {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 430px) {
      body {
        padding: 18px 12px;
      }

      .card {
        border-radius: 22px;
      }

      .feedback-row {
        align-items: stretch;
        flex-direction: column;
      }

      .next-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-icon" aria-hidden="true">🪐</span> Cosmic Quest</div>

    <section class="card" aria-live="polite">
      <div id="quiz-view">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score">Score: <strong id="score">0</strong></span>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Quiz progress"
          aria-valuemin="1"
          aria-valuemax="10"
          aria-valuenow="1"
        >
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-wrap">
          <p class="eyebrow" id="category">Solar System</p>
          <h1 id="question">Loading question…</h1>
          <fieldset class="answers" id="answers" aria-label="Answer choices"></fieldset>
          <div class="feedback-row">
            <p class="feedback" id="feedback" role="status"></p>
            <button class="next-button" id="next-button" type="button" hidden>Next →</button>
          </div>
        </div>
      </div>

      <div class="results" id="results" hidden>
        <div class="result-emoji" id="result-emoji" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h2 id="result-title">Cosmic work!</h2>
        <p class="result-label">Your final score</p>
        <p class="final-score"><span id="final-score">0</span>/10</p>
        <p class="result-message" id="result-message"></p>
        <button class="restart-button" id="restart-button" type="button">Launch again</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "Solar System",
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1
      },
      {
        category: "Historic Missions",
        question: "Who was the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "Sally Ride"],
        correct: 2
      },
      {
        category: "Spacecraft",
        question: "Which space telescope launched in December 2021?",
        answers: ["Hubble", "Kepler", "Spitzer", "James Webb"],
        correct: 3
      },
      {
        category: "The Moon",
        question: "What was the name of the first crewed mission to land on the Moon?",
        answers: ["Apollo 8", "Apollo 11", "Gemini 4", "Artemis I"],
        correct: 1
      },
      {
        category: "Our Galaxy",
        question: "What type of galaxy is the Milky Way?",
        answers: ["Elliptical", "Irregular", "Barred spiral", "Ring"],
        correct: 2
      },
      {
        category: "Planets",
        question: "Which planet has the shortest year?",
        answers: ["Mercury", "Earth", "Mars", "Neptune"],
        correct: 0
      },
      {
        category: "Spaceflight",
        question: "What does the ISS abbreviation stand for?",
        answers: [
          "International Space Station",
          "Interstellar Science Satellite",
          "Integrated Space System",
          "International Solar Station"
        ],
        correct: 0
      },
      {
        category: "Distant Worlds",
        question: "What is a planet outside our solar system called?",
        answers: ["Dwarf planet", "Exoplanet", "Protoplanet", "Rogue star"],
        correct: 1
      },
      {
        category: "Mars Exploration",
        question: "Which rover landed on Mars in February 2021?",
        answers: ["Curiosity", "Opportunity", "Spirit", "Perseverance"],
        correct: 3
      },
      {
        category: "Cosmic Physics",
        question: "What force keeps planets in orbit around the Sun?",
        answers: ["Magnetism", "Gravity", "Solar wind", "Friction"],
        correct: 1
      }
    ];

    const elements = {
      quizView: document.querySelector("#quiz-view"),
      results: document.querySelector("#results"),
      count: document.querySelector("#question-count"),
      score: document.querySelector("#score"),
      progressTrack: document.querySelector(".progress-track"),
      progressBar: document.querySelector("#progress-bar"),
      category: document.querySelector("#category"),
      question: document.querySelector("#question"),
      answers: document.querySelector("#answers"),
      feedback: document.querySelector("#feedback"),
      next: document.querySelector("#next-button"),
      finalScore: document.querySelector("#final-score"),
      resultEmoji: document.querySelector("#result-emoji"),
      resultTitle: document.querySelector("#result-title"),
      resultMessage: document.querySelector("#result-message"),
      restart: document.querySelector("#restart-button")
    };

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[currentQuestion];
      answered = false;
      elements.count.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      elements.score.textContent = score;
      elements.progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
      elements.progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      elements.category.textContent = item.category;
      elements.question.textContent = item.question;
      elements.answers.replaceChildren();
      elements.feedback.textContent = "";
      elements.feedback.className = "feedback";
      elements.next.hidden = true;
      elements.next.textContent = currentQuestion === questions.length - 1 ? "See results →" : "Next →";

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => selectAnswer(index, button));
        elements.answers.append(button);
      });
    }

    function selectAnswer(index, selectedButton) {
      if (answered) return;
      answered = true;

      const item = questions[currentQuestion];
      const buttons = [...elements.answers.querySelectorAll(".answer")];
      buttons.forEach((button) => {
        button.disabled = true;
      });

      if (index === item.correct) {
        score += 1;
        elements.score.textContent = score;
        selectedButton.classList.add("correct");
        selectedButton.querySelector(".answer-letter").textContent = "✓";
        elements.feedback.textContent = "Correct — stellar work!";
        elements.feedback.classList.add("good");
      } else {
        selectedButton.classList.add("wrong");
        selectedButton.querySelector(".answer-letter").textContent = "×";
        buttons[item.correct].classList.add("correct");
        buttons[item.correct].querySelector(".answer-letter").textContent = "✓";
        buttons.forEach((button, buttonIndex) => {
          if (buttonIndex !== index && buttonIndex !== item.correct) {
            button.classList.add("dimmed");
          }
        });
        elements.feedback.textContent = `Not quite — it’s ${item.answers[item.correct]}.`;
        elements.feedback.classList.add("bad");
      }

      elements.next.hidden = false;
      elements.next.focus();
    }

    function showResults() {
      const percentage = score / questions.length;
      let result;

      if (percentage === 1) {
        result = ["🌟", "Perfect orbit!", "A flawless mission. You’re a true cosmic expert!"];
      } else if (percentage >= 0.8) {
        result = ["🚀", "Out of this world!", "Your space knowledge is cleared for launch."];
      } else if (percentage >= 0.5) {
        result = ["🛰️", "Solid trajectory!", "Nice flying, explorer. One more mission will sharpen your skills."];
      } else {
        result = ["🌙", "Keep exploring!", "Every great astronaut starts somewhere. Give it another orbit!"];
      }

      elements.quizView.hidden = true;
      elements.results.hidden = false;
      elements.finalScore.textContent = score;
      elements.resultEmoji.textContent = result[0];
      elements.resultTitle.textContent = result[1];
      elements.resultMessage.textContent = result[2];
      elements.restart.focus();
    }

    elements.next.addEventListener("click", () => {
      if (!answered) return;
      currentQuestion += 1;

      if (currentQuestion < questions.length) {
        renderQuestion();
        elements.question.focus({ preventScroll: true });
      } else {
        showResults();
      }
    });

    elements.restart.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      elements.results.hidden = true;
      elements.quizView.hidden = false;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
